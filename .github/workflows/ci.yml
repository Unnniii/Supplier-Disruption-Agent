name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SDA_PROVIDER: fake
      SDA_RETRIEVER: keyword
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python scripts/seed_erp.py
      - run: uv run pytest -q
      - name: Offline scan, all 34 headlines, scored
        run: |
          uv run python -m agent.run --fake
          uv run python -m agent.evaluate --no-rag

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
