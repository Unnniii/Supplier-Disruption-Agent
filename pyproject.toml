[project]
name = "supplier-disruption-agent"
version = "0.1.0"
description = "Agent that reads news, maps disruptions to suppliers in an ERP, and flags at-risk parts with contract-backed advice"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "chromadb>=0.5",
    "google-genai>=1.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.25"]   # write run records to BigQuery (cloud job)
ui = ["streamlit>=1.38"]                # planned demo app; ~300 MB, kept out of the cloud image

[dependency-groups]
dev = ["pytest>=8.0", "google-cloud-bigquery>=3.25"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
