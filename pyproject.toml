[project]
name = "supplier-disruption-agent"
version = "0.1.0"
description = "Agent that reads news, maps disruptions to suppliers in an ERP, and flags at-risk parts with contract-backed advice"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "chromadb>=0.5",
    "anthropic>=0.40",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
