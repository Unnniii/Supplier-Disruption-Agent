<text x="40" y="48" font-size="26" font-weight="bold" fill="#111">Supplier Disruption Agent · architecture</text>
<text x="40" y="74" font-size="15" fill="#555">News in → four AI agents (LangGraph) → checked by code → remembered across days → alert, stored in BigQuery, scored against a hand-written answer key</text>
<rect x="310" y="96" width="1090" height="48" rx="10" fill="#F3EBFB" stroke="#7A4CC2" stroke-width="1.8"/>
<text x="855" y="117" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Model boundary: every agent calls the LLM through one interface</text>
<text x="855" y="136" font-size="13.5" text-anchor="middle" fill="#333">Gemini free tier · Ollama (local) · Claude   |   per-run call cap · rate-limit retry · one JSON repair turn</text>
<rect x="30" y="160" width="250" height="260" rx="12" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
