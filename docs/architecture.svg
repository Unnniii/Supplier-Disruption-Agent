<text x="155.0" y="358" font-size="14" text-anchor="middle" fill="#333">GDELT · publisher RSS</text>
<text x="155.0" y="377" font-size="14" text-anchor="middle" fill="#333">Google News · max 15/day</text>
<rect x="310" y="160" width="1090" height="240" rx="12" fill="#FAFBFF" stroke="#3B6FD8" stroke-width="1.5"/>
